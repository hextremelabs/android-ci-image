name: Validate and publish

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/read-contract.sh
      - .github/workflows/publish.yml
      - Dockerfile
      - smoke.sh
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/read-contract.sh
      - .github/workflows/publish.yml
      - Dockerfile
      - smoke.sh

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read image contract
        id: meta
        run: .github/read-contract.sh >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          BASE_DIGEST: ${{ steps.meta.outputs.base_digest }}
          BASE_NAME: ${{ steps.meta.outputs.base_name }}
        run: |
          docker build \
            --label "org.opencontainers.image.base.name=$BASE_NAME" \
            --label "org.opencontainers.image.base.digest=$BASE_DIGEST" \
            -t android-ci:validate .

      - name: Verify
        env:
          BASE_DIGEST: ${{ steps.meta.outputs.base_digest }}
          BASE_NAME: ${{ steps.meta.outputs.base_name }}
          EXPECT_JDK: ${{ steps.meta.outputs.jdk }}
          EXPECT_PLATFORM: ${{ steps.meta.outputs.platform }}
        run: |
          labels=$(docker image inspect --format '{{ json .Config.Labels }}' android-ci:validate)
          assert_label() {
              got=$(printf '%s' "$labels" | jq -r --arg k "$1" '.[$k] // ""')
              [[ "$got" == "$2" ]] ||
                  { echo "::error::$1 is '$got', expected '$2'"; exit 1; }
          }
          assert_label org.opencontainers.image.base.name "$BASE_NAME"
          assert_label org.opencontainers.image.base.digest "$BASE_DIGEST"
          docker run --rm \
            -e EXPECT_JDK \
            -e EXPECT_PLATFORM \
            -v "$PWD/smoke.sh:/smoke.sh:ro" \
            android-ci:validate sh /smoke.sh

  publish:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read image contract
        id: meta
        run: .github/read-contract.sh >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          BASE_DIGEST: ${{ steps.meta.outputs.base_digest }}
          BASE_NAME: ${{ steps.meta.outputs.base_name }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          docker build \
            --label "org.opencontainers.image.base.name=$BASE_NAME" \
            --label "org.opencontainers.image.base.digest=$BASE_DIGEST" \
            --label "org.opencontainers.image.created=$created" \
            --label "org.opencontainers.image.documentation=$source#readme" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$source" \
            --label "org.opencontainers.image.url=$source" \
            --label "org.opencontainers.image.version=$TAG" \
            -t "$IMAGE:$TAG" .

      - name: Verify
        env:
          BASE_DIGEST: ${{ steps.meta.outputs.base_digest }}
          BASE_NAME: ${{ steps.meta.outputs.base_name }}
          EXPECT_JDK: ${{ steps.meta.outputs.jdk }}
          EXPECT_PLATFORM: ${{ steps.meta.outputs.platform }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          labels=$(docker image inspect --format '{{ json .Config.Labels }}' "$IMAGE:$TAG")
          assert_label() {
              got=$(printf '%s' "$labels" | jq -r --arg k "$1" '.[$k] // ""')
              [[ "$got" == "$2" ]] ||
                  { echo "::error::$1 is '$got', expected '$2'"; exit 1; }
          }
          assert_label org.opencontainers.image.base.name "$BASE_NAME"
          assert_label org.opencontainers.image.base.digest "$BASE_DIGEST"
          docker run --rm \
            -e EXPECT_JDK \
            -e EXPECT_PLATFORM \
            -v "$PWD/smoke.sh:/smoke.sh:ro" \
            "$IMAGE:$TAG" sh /smoke.sh

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: ${{ runner.temp }}/android-ci.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        run: |
          image="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker push "$image"
          digest_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          digest=${digest_ref##*@}
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid published digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-version: ${{ steps.meta.outputs.tag }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/android-ci.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Summary
        run: |
          {
            echo "Published \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
